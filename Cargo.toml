[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/agent-kernel",
    "crates/niat-tui",
    "crates/tool-runtime",
    "crates/mcp-client",
    "crates/niat-installer",
    "crates/system-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# HTTP / LLM
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio-stream = "0.1"
eventsource-stream = "0.2"

# System
nix = { version = "0.29", features = ["fs", "process", "signal", "net", "ioctl"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
niat-common = { path = "crates/common" }
tool-runtime = { path = "crates/tool-runtime" }
mcp-client = { path = "crates/mcp-client" }
system-manager = { path = "crates/system-manager" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
